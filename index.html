<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小王子 · 冷雨夜便利店 3D 世界</title>
<style>
  :root{
    --ink: #eaf0f8;
    --dim: rgba(214, 228, 245, .58);
    --line: rgba(150, 190, 230, .22);
    --glow: #7fd4ff;
    --warm: #ffbf78;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ width:100%; height:100%; overflow:hidden; background:#04070d; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #app{ position:fixed; inset:0; }
  #app canvas{ display:block; }

  /* ---------- 标题 ---------- */
  .hud{
    position:fixed; inset:0; pointer-events:none;
    opacity:0; transition: opacity 1.2s ease .4s;
  }
  .hud.live{ opacity:1; }

  .title{
    position:absolute; top:44px; left:48px;
    max-width: 460px;
  }
  .kicker{
    font-size:10px; letter-spacing:.32em; text-transform:uppercase;
    color: rgba(160, 205, 240, .62);
    margin-bottom:14px;
  }
  .title h1{
    font-family: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", Georgia, serif;
    font-size:34px; font-weight:500; letter-spacing:.04em; line-height:1.25;
    text-shadow: 0 0 32px rgba(120, 190, 255, .35);
  }
  .title h1 em{
    font-style:normal;
    color: var(--warm);
    text-shadow: 0 0 26px rgba(255, 170, 90, .55);
  }
  .title p{
    margin-top:12px; font-size:12.5px; line-height:1.9; color: var(--dim);
    letter-spacing:.04em;
  }
  .rule{
    width:38px; height:1px; margin:18px 0 0;
    background: linear-gradient(90deg, rgba(127,212,255,.85), rgba(127,212,255,0));
  }

  /* ---------- 控制 ---------- */
  .dock{
    position:absolute; right:44px; bottom:40px;
    display:flex; gap:10px; pointer-events:auto;
  }
  .btn{
    font: inherit; font-size:11.5px; letter-spacing:.14em;
    padding:9px 16px; border-radius:999px; cursor:pointer;
    color: rgba(226, 238, 252, .82);
    background: rgba(14, 24, 38, .55);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: all .25s ease;
  }
  .btn:hover{ color:#fff; border-color: rgba(127,212,255,.55); background: rgba(22, 40, 60, .7); }
  .btn[data-on="true"]{
    color: #04121c; background: rgba(127, 212, 255, .88);
    border-color: rgba(127,212,255,.9);
    box-shadow: 0 0 24px rgba(127,212,255,.45);
  }

  .hint{
    position:absolute; left:50%; bottom:46px; transform:translateX(-50%);
    font-size:11px; letter-spacing:.24em; color: rgba(190, 214, 238, .42);
    white-space:nowrap;
    transition: opacity 1.4s ease;
  }
  .hint.gone{ opacity:0; }

  /* ---------- 加载 ---------- */
  #loader{
    position:fixed; inset:0; z-index:20;
    background: radial-gradient(120% 90% at 50% 45%, #0a1320 0%, #03060b 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    transition: opacity .9s ease; 
  }
  #loader.done{ opacity:0; pointer-events:none; }
  #loader .lb-mark{
    font-family: "Songti SC", Georgia, serif; font-size:13px; letter-spacing:.42em;
    color: rgba(200, 222, 245, .55);
  }
  #loader .lb-bar{
    width:150px; height:1px; background: rgba(120,170,220,.16); overflow:hidden;
  }
  #loader .lb-bar i{
    display:block; height:100%; width:35%;
    background: linear-gradient(90deg, transparent, #8fd8ff, transparent);
    animation: sweep 1.15s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{ transform: translateX(-120%); }
    100%{ transform: translateX(320%); }
  }
  #err{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:30; display:none; max-width:520px; padding:26px 30px;
    border:1px solid rgba(255,120,120,.35); border-radius:14px;
    background: rgba(24,10,14,.9); color:#ffd7d7; font-size:13px; line-height:1.8;
  }

  @media (max-width: 720px){
    .title{ top:26px; left:24px; right:24px; max-width:none; }
    .title h1{ font-size:24px; }
    .title p{ font-size:11.5px; }
    .dock{ right:20px; bottom:24px; }
    .hint{ bottom:74px; font-size:10px; letter-spacing:.14em; }
  }
</style>
</head>
<body>

<div id="app"></div>

<div class="hud" id="hud">
  <div class="title">
    <div class="kicker">Le Petit Prince · 3D World</div>
    <h1>冷雨夜，<em>便利店</em>还亮着</h1>
    <p>一颗悬在夜里的迷你星球。街角那家店的门一直开着，<br>湿润的路面把霓虹和灯光都揉成了一片。</p>
    <div class="rule"></div>
  </div>

  <div class="hint" id="hint">拖动旋转 · 滚轮缩放</div>

  <div class="dock">
    <button class="btn" id="btn-rotate" data-on="true">自动旋转</button>
    <button class="btn" id="btn-reset">重置视角</button>
  </div>
</div>

<div id="loader">
  <div class="lb-mark">LE PETIT PRINCE</div>
  <div class="lb-bar"><i></i></div>
</div>

<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
